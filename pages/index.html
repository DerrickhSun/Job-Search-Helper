<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job-Applyer Control Panel</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 560px;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; margin-bottom: 0.75rem; font-size: 0.9rem; }
    input[type="text"], input[type="password"], input[type="number"], select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.4rem 0.5rem;
      margin-top: 0.25rem;
      font-size: 0.9rem;
      font-family: inherit;
    }
    textarea { resize: vertical; }
    label.checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    label.checkbox input[type="checkbox"] { width: auto; margin: 0; }
    h3 { font-size: 1rem; margin: 1.25rem 0 0.5rem; }
    button {
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #status, #config-status, #save-config-status, #load-status, #save-status {
      margin-top: 0.5rem;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: #1a7f37; }
    .err { color: #cf222e; }
  </style>
</head>
<body>
  <h1>Job-Applyer Control Panel</h1>
  <p>
    Talks to your own <code>extension_server.py</code>, running locally — same server the
    browser extension uses. Nothing here is sent anywhere except to the address below.
  </p>

  <fieldset>
    <legend>Server settings</legend>
    <label>
      Server URL
      <input type="text" id="server-url" placeholder="http://127.0.0.1:8743" />
    </label>
    <label>
      Token
      <input type="password" id="token" placeholder="paste your COVER_LETTER_SERVER_TOKEN" />
    </label>
    <button id="save">Save</button>
    <span id="save-status"></span>
  </fieldset>

  <button id="ping">Ping local server</button>
  <div id="status"></div>

  <fieldset>
    <legend>Bot config</legend>
    <button id="load-config" type="button">Load config</button>
    <span id="load-status"></span>

    <div id="config-form" hidden>
      <h3>Behavior</h3>
      <label class="checkbox"><input type="checkbox" id="cfg-skip-consulting" /> Skip consulting/staffing companies</label>
      <label class="checkbox"><input type="checkbox" id="cfg-consulting-memory" /> Remember consulting companies seen before</label>
      <label class="checkbox"><input type="checkbox" id="cfg-gh-manual-next" /> Greenhouse: prompt before scanning next listing</label>
      <label class="checkbox"><input type="checkbox" id="cfg-gh-prefetch" /> Greenhouse: prefetch next listing</label>
      <label class="checkbox"><input type="checkbox" id="cfg-gh-prompt-close" /> Greenhouse: prompt before closing browser</label>
      <label>
        Greenhouse date-posted filter (optional)
        <input type="text" id="cfg-gh-date-posted" placeholder="e.g. past_ten_days — blank = automatic" />
      </label>
      <label>
        Greenhouse gate-probe max listings
        <input type="number" id="cfg-gh-gate-probe" min="0" step="1" />
      </label>
      <label>
        Student job mode
        <select id="cfg-student-mode"></select>
      </label>
      <label>
        Unpaid job mode
        <select id="cfg-unpaid-mode"></select>
      </label>

      <h3>Search</h3>
      <label>
        Keywords (one per line)
        <textarea id="cfg-keywords" rows="4"></textarea>
      </label>
      <label>
        Location
        <input type="text" id="cfg-location" />
      </label>
      <label class="checkbox"><input type="checkbox" id="cfg-posted-24h" /> Posted within 24 hours only</label>

      <button id="save-config" type="button">Save updates</button>
      <span id="save-config-status"></span>
    </div>
  </fieldset>

  <script src="app.js"></script>
</body>
</html>
