<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Job Help</title>
<style>
  body {
    margin: 0;
    padding: 12px;
    width: 220px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  button {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    cursor: pointer;
  }
  button:disabled {
    cursor: default;
    opacity: 0.6;
  }
  #status {
    margin-top: 10px;
    color: #444;
    white-space: pre-line;
  }
  a {
    color: inherit;
  }
  #easy-apply-log-section {
    margin-top: 10px;
    border-top: 1px solid #ddd;
    padding-top: 8px;
  }
  #easy-apply-log-heading {
    font-weight: 600;
    margin-bottom: 4px;
  }
  #easy-apply-log-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 140px;
    overflow-y: auto;
  }
  #easy-apply-log-list li {
    padding: 3px 0;
    border-bottom: 1px solid #f0f0f0;
    overflow-wrap: break-word;
  }
  #easy-apply-log-list li:last-child {
    border-bottom: none;
  }
  .easy-apply-service {
    font-weight: 600;
  }
  .easy-apply-time {
    color: #777;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="actions">
    <button id="fill-form-btn" type="button">Fill form</button>
    <button id="save-fields-btn" type="button">Save fields</button>
    <button id="open-config-btn" type="button">Open config page</button>
  </div>
  <div id="status"></div>
  <div id="easy-apply-log-section" hidden>
    <div id="easy-apply-log-heading">Recently detected</div>
    <ul id="easy-apply-log-list"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
